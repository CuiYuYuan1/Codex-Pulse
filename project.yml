# Codex-Pulse — XcodeGen 工程定义
# 安装: brew install xcodegen
# 生成: xcodegen generate
# 打开: open CodexPulse.xcodeproj

name: CodexPulse
options:
  bundleIdPrefix: com.codexpulse
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # 本机 Xcode Personal Team；主 App 与 Widget 必须使用同一个 Team 才能共享 App Group。
    DEVELOPMENT_TEAM: 24DU2DDG59
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.26"

packages: {}

targets:
  CodexPulse:
    type: application
    platform: macOS
    sources:
      - path: CodexPulse
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codexpulse.app
        INFOPLIST_FILE: CodexPulse/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: CodexPulse/Resources/CodexPulse.entitlements
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    dependencies:
      - target: CodexPulseWidget
        embed: true
    scheme:
      testTargets: []

  CodexPulseWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: CodexPulseWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codexpulse.app.widget
        INFOPLIST_FILE: CodexPulseWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: CodexPulseWidget/CodexPulseWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        SKIP_INSTALL: YES

schemes:
  CodexPulse:
    build:
      targets:
        CodexPulse: all
        CodexPulseWidget: all
    run:
      config: Debug
