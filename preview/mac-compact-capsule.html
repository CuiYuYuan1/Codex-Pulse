<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 324px; height: 116px; margin: 0; overflow: hidden; background: transparent; }
    body { display: grid; place-items: start center; padding-top: 12px; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; color: rgba(255,255,255,.94); }
    .capsule {
      position: relative; width: 275px; height: 64px; overflow: hidden; border-radius: 32px;
      display: grid; grid-template-columns: 72px 40px 1px minmax(72px, 1fr) 9px; align-items: center; gap: 8px;
      padding: 0 14px;
      background: linear-gradient(145deg, rgba(62,74,91,.94), rgba(29,33,42,.96));
      border: 1px solid rgba(255,255,255,.32);
      box-shadow: inset 0 1px rgba(255,255,255,.24), 0 9px 24px rgba(0,0,0,.34);
    }
    .weather { position: absolute; inset: 2px auto 2px 2px; width: 102px; overflow: hidden; border-radius: 30px 0 0 30px; background: linear-gradient(90deg,#2169a7 0%,#173653 62%,transparent 100%); mask-image: linear-gradient(90deg,#000 0 55%,rgba(0,0,0,.6) 78%,transparent 100%); }
    .weather img { position: absolute; width: 74px; height: 64px; left: -1px; top: -2px; }
    .spacer { width: 62px; height: 1px; }
    .quota { position: relative; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(#32d768 0 100%); box-shadow: 0 0 7px rgba(50,215,104,.24); }
    .quota::after { content:""; position:absolute; inset:3px; border-radius:50%; background:#303641; }
    .quota strong { position:relative; z-index:1; width:32px; text-align:center; font-size:9.5px; line-height:1; font-variant-numeric:tabular-nums; }
    .divider { width:1px; height:22px; background:rgba(255,255,255,.16); }
    .tokens { min-width:0; display:flex; align-items:center; justify-content:center; gap:5px; }
    .bean { position:relative; width:12px; height:17px; flex:0 0 auto; border-radius:50%; transform:rotate(-24deg); background:linear-gradient(145deg,#60b5ff,#84502e); box-shadow:0 0 6px rgba(69,183,255,.3); }
    .bean::after { content:""; position:absolute; left:5px; top:2px; width:3px; height:13px; border-left:1px solid rgba(255,255,255,.72); border-radius:50%; transform:rotate(-12deg); }
    .tokens strong { min-width:0; font-size:15px; line-height:1; white-space:nowrap; font-variant-numeric:tabular-nums; }
    .chevron { width:7px; height:7px; border-right:1.5px solid rgba(255,255,255,.55); border-bottom:1.5px solid rgba(255,255,255,.55); transform:rotate(45deg) translateY(-2px); }
    .info { margin-top:5px; height:22px; padding:0 10px; border-radius:11px; display:flex; align-items:center; gap:6px; font-size:10px; font-weight:600; color:rgba(255,255,255,.88); background:rgba(25,30,38,.88); border:1px solid rgba(255,255,255,.19); box-shadow:0 5px 13px rgba(0,0,0,.25); }
    .dot { color:rgba(255,255,255,.34); }
  </style>
</head>
<body>
  <div>
    <div class="capsule">
      <div class="weather"><img src="../CodexPulse/Resources/WeatherAnimated/partly-cloudy-day.svg" alt=""></div>
      <span class="spacer"></span>
      <span class="quota"><strong>100%</strong></span>
      <span class="divider"></span>
      <span class="tokens"><i class="bean"></i><strong>105.2M</strong></span>
      <span class="chevron"></span>
    </div>
    <div class="info"><span>☁︎ 27°C</span><span class="dot">•</span><span>广州</span><span class="dot">•</span><span>周日 14:08</span></div>
  </div>
</body>
</html>
