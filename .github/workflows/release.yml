name: Release macOS and Windows

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build universal DMG
        env:
          OUTPUT_DIR: ${{ runner.temp }}/release
          BUILD_DIR: ${{ runner.temp }}/macos-build
          ARCHS_VALUE: arm64 x86_64
        run: bash Scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: ${{ runner.temp }}/release/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Resolve version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm version "$env:VERSION" --no-git-tag-version --allow-same-version
      - run: npm test
      - run: npm run pack:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/windows/*.exe
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: cd release-assets && sha256sum * > SHA256SUMS.txt
      - name: Prepare release notes
        shell: bash
        run: |
          NOTES_FILE="ReleaseNotes/${GITHUB_REF_NAME}.md"
          OUTPUT_FILE="${RUNNER_TEMP}/release-notes.md"
          if [[ -f "$NOTES_FILE" ]]; then
            cp "$NOTES_FILE" "$OUTPUT_FILE"
          else
            PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            {
              echo "更新内容"
              echo
              if [[ -n "$PREVIOUS_TAG" ]]; then
                git log --format='- %s' "${PREVIOUS_TAG}..${GITHUB_REF_NAME}"
                echo
                echo "完整变更：https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${GITHUB_REF_NAME}"
              else
                echo "- 稳定性与体验优化。"
              fi
            } > "$OUTPUT_FILE"
          fi
          echo "RELEASE_NOTES_FILE=$OUTPUT_FILE" >> "$GITHUB_ENV"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "CodexPulse ${GITHUB_REF_NAME}" \
              --notes-file "$RELEASE_NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --notes-file "$RELEASE_NOTES_FILE" \
              --title "CodexPulse ${GITHUB_REF_NAME}"
          fi
